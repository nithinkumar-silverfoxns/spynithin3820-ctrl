name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///./ci.db"
      JWT_SECRET: "ci-secret-not-for-production"
      # Fixed Fernet key so encryption round-trips in tests.
      FERNET_KEY: "cH9mHglp7bYQ3nE6Vq2tZ1fY0wKxLp4sJ7uR8aB3cD0="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run migrations (sqlite)
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest tests/ -q

  mobile-typecheck:
    name: Mobile type-check (advisory)
    runs-on: ubuntu-latest
    # Advisory until verified on a machine with the full RN toolchain.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: TypeScript type-check
        working-directory: mobile
        run: npx tsc --noEmit
